name: DEV-006 focused verification (temporary)
on:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/roadmap.mjs --task=DEV-006 --run
      - run: node scripts/roadmap.mjs --check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
