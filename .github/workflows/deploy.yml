name: Publish Infipet
on:
  workflow_run:
    workflows: [Verify Infipet]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      INFIPET_BASE_URL: /infipet
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Qualify manual publication of this exact commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          node scripts/roadmap.mjs --check
          pnpm typecheck
          pnpm test
      - name: Export verified web app under the repository path
        run: pnpm build:web
      - run: pnpm exec playwright install --with-deps chromium
      - name: Qualify exported daily player flows before publishing
        run: pnpm test:ui
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
