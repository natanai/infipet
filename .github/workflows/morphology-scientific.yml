name: Scientific Morphology Qualification
on:
  workflow_dispatch:
    inputs:
      enforce_gate:
        description: "Fail when production morphology lacks independently verified breadth"
        required: true
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  morphology-scientific:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MORPH_SCIENTIFIC: "1"
      MORPH_QUALIFY: ${{ inputs.enforce_gate && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Evaluate 30 independent drawings through 365 days
        run: pnpm exec tsx --test tests/alg-evaluation-morphology-scientific.test.ts
