# Run only when the existing "enhancement" label is freshly added to PR #58.
# Remove and re-add that label to deliberately rerun; no automatic push CI.
# The player-facing GitHub Pages publishing workflow is NOT invoked.
name: Experimental morphology qualification
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: morphology-pr-58
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.pull_request.number == 58 && github.event.label.name == 'enhancement'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript typecheck
        run: pnpm typecheck
      - name: Physical morphology regression
        run: pnpm exec tsx --test tests/alg-development-articulated-rotation.test.ts
      - name: Stage-by-stage 365-day cohort
        timeout-minutes: 12
        env:
          MORPH_STAGE_COHORT: '1'
        run: pnpm exec tsx --test tests/alg-evaluation-stage-trajectory.test.ts
# Qualification revision 3: explicit single-shot full-life numerical check.
