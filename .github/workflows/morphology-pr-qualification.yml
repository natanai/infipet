# Run only when the existing "enhancement" label is freshly added to PR #58.
# Remove and re-add that label to deliberately rerun; no automatic push CI.
# The player-facing GitHub Pages publishing workflow is NOT invoked.
name: Experimental morphology qualification
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: morphology-pr-58
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.pull_request.number == 58 && github.event.label.name == 'enhancement'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript typecheck
        run: pnpm typecheck
      - name: Five-epoch daily stage contract
        run: pnpm exec tsx --test tests/alg-development-stage-contract.test.ts
      - name: Five-stage physical scheduling properties
        run: pnpm exec tsx --test tests/alg-development-stage-pressures.test.ts
      - name: Physical morphology regression
        run: pnpm exec tsx --test tests/alg-development-articulated-rotation.test.ts
      - name: Head and attached face physical ontogeny regression
        run: pnpm exec tsx --test tests/alg-development-head-migration.test.ts
      - name: Body-only unlabeled source-lobe articulation and independent replay
        run: pnpm exec tsx --test tests/alg-development-source-lobe-turn.test.ts
      - name: Real five-stage authored head movement cohort
        timeout-minutes: 12
        env:
          HEAD_TRAJECTORY_COHORT: '1'
        run: pnpm exec tsx --test tests/alg-evaluation-head-trajectory.test.ts
      - name: Independent stage identity anti-bulk oracle
        run: pnpm exec tsx --test tests/alg-evaluation-stage-identity.test.ts
      - name: Dense source material intercalation and independent replay
        run: pnpm exec tsx --test tests/alg-development-dense-intercalation.test.ts
      - name: Strict source-pair and anti-bulk evaluator unit tests
        run: pnpm exec tsx --test tests/alg-evaluation-stage-identity.test.ts
      - name: Whole-organism source shear and independent reconstruction
        run: pnpm exec tsx --test tests/alg-development-whole-organism-shear.test.ts
      # Held-out long cohort remains separately opt-in; first prove exact
      # ancestral head motion and attached anatomical invariants.
# Qualification revision 10: test conserved vacancy-chain transport with independent chronological audit.
