name: Integration Web Export
on:
  pull_request:
    paths:
      - "App.tsx"
      - "src/components/**"
      - "src/presets.ts"
      - "src/palette.ts"
      - "scripts/offline-web.mjs"
      - "tests/player-interface.browser.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/integration/**"
      - "scripts/benchmark-browser-runtime.mjs"
      - "src/simulation/**"
      - "tests/alg-integration-unified-development.test.ts"
      - ".github/workflows/integration-web.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export deployable web bundle
        run: pnpm build:web
      - name: Install browser for player-flow verification
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify player interface and offline return
        run: pnpm test:ui
      - name: Profile actual player one-second ticks in headless desktop/mobile-viewport Chromium
        run: node scripts/benchmark-browser-runtime.mjs
      - name: Benchmark 32x32 ink through 720h and 8192h
        run: node --max-old-space-size=768 --import tsx scripts/benchmark-unified.ts
