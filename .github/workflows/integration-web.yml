name: Integration Web Export
on:
  pull_request:
    paths:
      - "App.tsx"
      - "src/**"
      - "scripts/**"
      - "tests/player-interface.browser.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "app.config.ts"
      - ".github/workflows/integration-web.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INFIPET_BASE_URL: /infipet
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export deployable app under the Pages path
        run: pnpm build:web
      - name: Install browser for real player flows
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify daily boundaries, saved-year reopening, recovery and offline return
        run: pnpm test:ui
      - name: Measure actual saved-life browser responsiveness
        run: node scripts/benchmark-browser-runtime.mjs
