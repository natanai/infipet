name: Verify Infipet
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/roadmap.mjs --check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify explicit brush semantics, authored feature conservation and tree placement
        run: pnpm exec tsx --test tests/alg-lineage-authored-brush.test.ts tests/alg-development-coherent-anatomy.test.ts
      - name: Independent morphology regression witnesses and daily integration
        run: pnpm exec tsx --test tests/alg-evaluation-morphology-controls.test.ts tests/alg-integration-morphology-preview.test.ts tests/alg-evaluation-morphology-scientific.test.ts
      - name: Independently verify UI geometry and native care cue contracts
        run: pnpm test:ux-contracts
