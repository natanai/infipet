name: Daily runtime performance evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify isolated daily-runtime budgets
        run: node scripts/roadmap.mjs --task=PERF-001 --run
      - name: Measure warm scenarios against fresh chronological cold references
        run: node --expose-gc --max-old-space-size=768 --import tsx scripts/daily-benchmark.ts
