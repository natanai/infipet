# TEMPORARY branch-only held-out verification, deleted before merge
name: Temporary Held-Out Metamorphosis Qualification
on:
  push:
    branches: [development/physical-joint-articulation]
permissions:
  contents: read
jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Independent 144-lifetime five-form acceptance
        env:
          STAGE_HELD_OUT_COHORT: "1"
        run: pnpm exec tsx --test tests/alg-evaluation-stage-heldout.test.ts
