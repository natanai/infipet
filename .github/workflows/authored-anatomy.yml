name: Authored Anatomy and Tree Contract
on:
  push:
    branches:
      - architecture/authored-anatomy-phylogeny
  pull_request:
    paths:
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'roadmap/plan.json'
      - 'src/part-guide.ts'
      - 'tests/repository-guidance.test.ts'
      - 'src/genetics/**'
      - 'src/lineage/**'
      - 'src/phylogeny/**'
      - 'src/development/**'
      - 'src/drawing.ts'
      - 'tests/alg-lineage-authored-brush.test.ts'
      - '.github/workflows/authored-anatomy.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Ensure canonical documentation and removal of obsolete entrypoints
        run: pnpm exec tsx --test tests/repository-guidance.test.ts
      - name: Verify player-declared anatomy and tree selection
        run: pnpm exec tsx --test tests/alg-lineage-authored-brush.test.ts tests/alg-genetics-readable-seed.test.ts tests/alg-observation-affinity.test.ts tests/alg-observation-robustness.test.ts tests/alg-integration-runtime.test.ts
      - name: Verify independent source continuity and growth conservation
        run: pnpm exec tsx --test tests/alg-development-coherent-anatomy.test.ts
